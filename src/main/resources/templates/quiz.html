<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
</head>
<body>

<h1><a th:href="@{/}">Quiz</a></h1>
<h2>Which chapter was this weapon introduced?</h2>

<form th:action="@{/quiz/result}" method="post">
    <div th:each="weapon : ${weapons}">
        <p th:text="${weapon.name}"></p>
        <div th:each="chapter : ${chapters}">
            <label>
                <input type="radio"
                       th:name="${weapon.weaponId}"
                       th:value="${chapter.chapterNumber}" />
                <span th:text="${chapter.chapterNumber}"></span>
            </label>
        </div>
        <br>
    </div>

    <input type="submit" value="Submit">
</form>

</body>
</html>
